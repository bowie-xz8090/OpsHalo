name: Release multi-platform

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag, for example v1.0.0
        required: true
        type: string
        default: v1.0.0
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.x
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Validate tag format
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

  verify-source:
    name: Verify source and behavior
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint source
        run: npm run lint

      - name: Run unit and Agent tests
        run: npm run test-unit-ci

      - name: Run integration tests
        run: npm run test-integration

      - name: Validate OpenSpec change
        run: npx openspec validate upgrade-agent-runtime-intelligence --strict

  build-windows:
    name: Windows x64
    needs: verify-source
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          npm config set legacy-peer-deps true
          npm install --global yarn node-gyp
          npm uninstall node-pty
          npm install --legacy-peer-deps
          npm install --save-exact node-pty@1.1.0-beta14

      - name: Verify pinned Codex runtime download and App Server initialization
        run: npm run verify-codex-runtime

      - name: Prepare packaged application
        run: npm run b

      - name: Verify packaged application excludes forbidden runtimes
        run: npm run verify-mini-artifact

      - name: Prepare electron-builder configuration
        run: npm run pb

      - name: Patch NSIS keep-shortcuts and install source
        run: |
          node -e "const c=require('./build/bin/build-common'); c.patchNsisKeepShortcuts(); c.writeSrc('win-x64-installer.exe')"

      - name: Build unsigned Windows packages
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis tar.gz --x64 --publish never

      - name: Enforce Windows release size limits
        run: npm run verify-release-size -- dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.exe
            dist/*.tar.gz

  build-macos-arm64:
    name: macOS ARM64
    needs: verify-source
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install setuptools
          npm config set legacy-peer-deps true
          npm install --global yarn
          npm ci --legacy-peer-deps

      - name: Verify pinned Codex runtime download and App Server initialization
        run: npm run verify-codex-runtime

      - name: Prepare packaged application
        run: npm run b

      - name: Verify packaged application excludes forbidden runtimes
        run: npm run verify-mini-artifact

      - name: Prepare electron-builder configuration
        run: npm run pb

      - name: Disable macOS notarization
        run: |
          node -e "const fs=require('fs'); const p='electron-builder.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); if (j.mac) j.mac.notarize=false; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n')"

      - name: Build unsigned macOS ARM64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Enforce macOS release size limit
        run: npm run verify-release-size -- dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          if-no-files-found: error
          retention-days: 7
          path: dist/*.dmg

  build-macos-x64:
    name: macOS x64
    needs: verify-source
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install setuptools
          npm config set legacy-peer-deps true
          npm install --global yarn
          npm ci --legacy-peer-deps

      - name: Verify pinned Codex runtime download and App Server initialization
        run: npm run verify-codex-runtime

      - name: Prepare packaged application
        run: npm run b

      - name: Verify packaged application excludes forbidden runtimes
        run: npm run verify-mini-artifact

      - name: Prepare electron-builder configuration
        run: npm run pb

      - name: Disable macOS notarization
        run: |
          node -e "const fs=require('fs'); const p='electron-builder.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); if (j.mac) j.mac.notarize=false; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n')"

      - name: Build unsigned macOS x64 DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --x64 --publish never

      - name: Enforce macOS release size limit
        run: npm run verify-release-size -- dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-x64
          if-no-files-found: error
          retention-days: 7
          path: dist/*.dmg

  build-linux-x64:
    name: Linux x64
    needs: verify-source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm xvfb
          npm config set legacy-peer-deps true
          npm install --global yarn
          npm ci --legacy-peer-deps

      - name: Verify pinned Codex runtime download and App Server initialization
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox build/bin/verify-codex-runtime.js

      - name: Prepare packaged application
        run: npm run b

      - name: Verify packaged application excludes forbidden runtimes
        run: npm run verify-mini-artifact

      - name: Prepare electron-builder configuration
        run: npm run pb

      - name: Build Linux packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --linux deb rpm AppImage tar.gz --x64 --publish never

      - name: Enforce Linux release size limits
        run: npm run verify-release-size -- dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz

  publish:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos-arm64
      - build-macos-x64
      - build-linux-x64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Recheck all release size limits
        run: node build/bin/verify-release-size.js release-assets

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            prerelease_flag=()
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              prerelease_flag+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "OpsHalo $RELEASE_TAG" \
              --generate-notes \
              "${prerelease_flag[@]}"
          fi

      - name: Show release URL
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url
